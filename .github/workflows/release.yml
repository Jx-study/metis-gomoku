name: Release

on:
  push:
    tags: ["v[0-9]*", "*-v[0-9]*"]
  workflow_dispatch:   # 手動觸發：只建置不發佈，用於驗證流程
  # release-please.yml 呼叫入口；GITHUB_TOKEN 打的 tag 不會觸發 push 事件
  workflow_call:
    inputs:
      tag:
        description: 要發佈的 tag
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # 一個平台失敗時其他仍跑完，第一次除錯能一次看到三邊的問題
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            lib: ai.dll
            artifact: Gomoku-windows.exe
          - os: ubuntu-latest
            lib: ai.so
            artifact: Gomoku-linux
          - os: macos-latest
            lib: ai.dylib
            artifact: Gomoku-macos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}   # 空字串沿用觸發事件的 ref

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile AI engine
        working-directory: src
        run: python utils/build.py

      - name: Install Python deps
        run: pip install -r requirements.txt

      # 門檻排在打包之前，引擎有問題就不該產出執行檔
      - name: Smoke test
        working-directory: src
        run: python utils/smoke_test.py ./${{ matrix.lib }}

      - name: Run tests
        run: pytest
        env:
          SDL_VIDEODRIVER: dummy   # runner 沒有顯示器，pygame 渲染測試用虛擬畫面

      # 打包設定全在 Gomoku.spec，改 UI 或資源檔不必動這份 workflow
      - name: Build executable
        working-directory: src
        run: pyinstaller Gomoku.spec

      # arm64 要求二進位至少有簽章，未簽章的會被 kernel 直接拒絕執行。
      # 這不解決 Gatekeeper quarantine，那要使用者自己繞過，見 release notes。
      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        working-directory: src/dist
        run: codesign -s - --force ${{ matrix.artifact }}

      # 前面的關卡測的都是原始碼樹，打包漏檔案不會被發現。
      # 不實際啟動 GUI：CI 沒有互動桌面，視窗跑不起來不代表打包有問題。
      - name: Verify packaged executable
        working-directory: src
        run: python utils/verify_bundle.py dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src/dist/${{ matrix.artifact }}
          if-no-files-found: error   # 空包直接失敗，不要靜默上傳

  publish:
    needs: build
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/**/*
          # release-please 已建好含 CHANGELOG 的 Release，這裡只附加安裝說明。
          # 不加 append_body 的話 body 會覆蓋掉 CHANGELOG。
          append_body: true
          body: |
            ## 安裝與執行 / Installation

            | 平台 Platform | 檔案 File |
            |---|---|
            | Windows | `Gomoku-windows.exe` |
            | macOS | `Gomoku-macos` |
            | Linux | `Gomoku-linux` |

            下載後直接執行，不需安裝 Python。
            Download and run directly. No Python installation required.

            ### Windows

            首次執行可能被 SmartScreen 攔下（未簽章執行檔），點「其他資訊」→「仍要執行」即可。
            SmartScreen may block it on first launch (unsigned executable): click "More info" → "Run anyway".

            ### macOS

            未簽章（無 Apple Developer ID），下載後先清掉 quarantine 標記：
            Unsigned build (no Apple Developer ID). Clear the quarantine flag first:

            ```
            xattr -cr Gomoku-macos && chmod +x Gomoku-macos
            ```

            ### Linux

            ```
            chmod +x Gomoku-linux
            ```

            > macOS 與 Linux 版本未經實機測試 / macOS and Linux builds are untested.
